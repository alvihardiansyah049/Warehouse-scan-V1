<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scan Resi Paket</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1f4e79" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Scan Resi" />

  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

  <header class="app-header">
    <span>📦 Scan Resi Paket</span>
  </header>

  <main class="app-container">

    <!-- STATUS BESAR -->
    <div id="statusBox" class="status-box status-idle">
      <div class="status-icon">📷</div>
      <div class="status-text">Siap Scan</div>
      <div id="statusResi" class="status-resi"></div>
    </div>

    <!-- KAMERA -->
    <section class="card">
      <div id="reader"></div>
      <div class="camera-controls">
        <button id="btnStart" class="btn btn-primary">▶ Mulai Kamera</button>
        <button id="btnStop" class="btn btn-danger" disabled>■ Stop</button>
      </div>
    </section>

    <!-- INFO HASIL SCAN -->
    <section class="card info-card">
      <div class="info-row">
        <span class="info-label">No. Resi</span>
        <span id="resiText" class="info-value">-</span>
      </div>
      <div class="info-divider"></div>
      <div class="info-row">
        <span class="info-label">Waktu Scan</span>
        <span id="scanTime" class="info-value">-</span>
      </div>
    </section>

    <!-- RIWAYAT -->
    <section class="card">
      <p class="section-title">Riwayat Sesi Ini</p>
      <ul id="historyList" class="history-list"></ul>
    </section>

  </main>

  <script src="script.js"></script>
  <script>
    // Daftarkan Service Worker untuk PWA
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("./sw.js")
          .then(function(reg) { console.log("SW registered:", reg.scope); })
          .catch(function(err) { console.log("SW error:", err); });
      });
    }
  </script>
</body>
</html>
