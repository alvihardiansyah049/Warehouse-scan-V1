<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scan Resi Paket</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

  <!-- ======================== HALAMAN LOGIN ======================== -->
  <div id="loginPage" class="login-page">
    <div class="login-card">
      <div class="login-logo">📦</div>
      <h1 class="login-title">Scan Resi Paket</h1>
      <p class="login-sub">Masuk untuk melanjutkan</p>

      <div class="input-group">
        <label>Username</label>
        <input type="text" id="inputUser" placeholder="Username" autocomplete="off" />
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="inputPass" placeholder="Password" />
      </div>

      <div id="loginError" class="login-error" style="display:none">
        ❌ Username atau password salah
      </div>

      <button id="btnLogin" class="btn-login">Masuk</button>
    </div>
  </div>

  <!-- ======================== HALAMAN UTAMA SCAN ======================== -->
  <div id="mainPage" class="main-page" style="display:none">

    <!-- HEADER -->
    <header class="app-header">
      <span>📦 Scan Resi Paket</span>
      <button id="btnLogout" class="btn-logout">Keluar</button>
    </header>

    <main class="app-container">

      <!-- STATUS BESAR DI ATAS (seperti di gambar) -->
      <div id="statusBox" class="status-box status-idle">
        <div class="status-icon">📷</div>
        <div class="status-text">Siap Scan</div>
        <div id="statusResi" class="status-resi"></div>
      </div>

      <!-- AREA KAMERA -->
      <section class="card">
        <div id="reader"></div>
        <div class="camera-controls">
          <button id="btnStart" class="btn btn-primary">▶ Mulai Kamera</button>
          <button id="btnStop" class="btn btn-danger" disabled>■ Stop</button>
        </div>
      </section>

      <!-- INFO HASIL SCAN -->
      <section class="card info-card">
        <div class="info-row">
          <span class="info-label">No. Resi</span>
          <span id="resiText" class="info-value">-</span>
        </div>
        <div class="info-divider"></div>
        <div class="info-row">
          <span class="info-label">Jasa Kirim</span>
          <span id="courierText" class="info-value">-</span>
        </div>
        <div class="info-divider"></div>
        <div class="info-row">
          <span class="info-label">Waktu Scan</span>
          <span id="scanTime" class="info-value">-</span>
        </div>
      </section>

      <!-- RIWAYAT SCAN -->
      <section class="card">
        <p class="section-title">Riwayat Sesi Ini</p>
        <ul id="historyList" class="history-list"></ul>
      </section>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
